<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1200" viewBox="0 0 1400 1200" role="img" aria-labelledby="title desc">
<title id="title">MX-RM-5V to Pico Explorer wiring and mini breadboard contacts</title>
<desc id="desc">Receiver VCC connects to USB VBUS 5 volts, ground to common ground, and DATA passes through a 3.3 volt powered SN74LVC1G17 buffer to GP0. In the pictured Explorer orientation, breadboard groups of five holes connect vertically on each side of a horizontal centre gap, with no power rails.</desc>
<rect width="1400" height="1200" fill="#ffffff"/>
<style>text{font-family:Arial,sans-serif;fill:#142b3b;font-size:22px}.small{font-size:18px}.heading{font-size:30px;font-weight:bold}.sub{font-size:24px;font-weight:bold}</style>
<text x="45" y="48" class="heading" text-anchor="start">RF receiver → Pico Explorer</text>
<text x="45" y="80" class="small" text-anchor="start">Proposed wiring • USB-powered Pico • use labelled buffer breakout pins</text>
