<text x="320" y="320" class="small" text-anchor="start">RF pulses</text>
<polyline points="770,370 950,370" fill="none" stroke="#167d62" stroke-width="4" stroke-linejoin="round"/>
<text x="790" y="357" class="small" text-anchor="start">3.3 V logic</text>
