<text x="690" y="785" class="sub" text-anchor="start">UP / DOWN: five holes connected</text>
<text x="690" y="821" class="" text-anchor="start">Each vertical group of five is one connection.</text>
<text x="690" y="859" class="" text-anchor="start">Adjacent columns are separate.</text>
<text x="690" y="925" class="sub" text-anchor="start">CENTRE GAP: no connection across it</text>
<text x="690" y="969" class="" text-anchor="start">Upper and lower groups are separate.</text>
<text x="690" y="1015" class="sub" text-anchor="start">No dedicated + / − power rails</text>
<text x="690" y="1053" class="" text-anchor="start">Nothing is powered until you add jumpers.</text>
<text x="690" y="1091" class="small" text-anchor="start">Receiver pins go left → right into separate columns.</text>
<text x="45" y="1162" class="small" text-anchor="start">Before power-on: use continuity mode to confirm five-hole groups, separate columns, and the centre gap.</text>
</svg>