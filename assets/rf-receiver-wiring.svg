<polyline points="650,450 650,540" fill="none" stroke="#344653" stroke-width="4" stroke-linejoin="round"/>
<circle cx="650" cy="540" r="5" fill="#344653"/>
<text x="670" y="530" class="small" text-anchor="start">Common ground</text>
<text x="45" y="585" class="small" text-anchor="start">Fit 100 nF between buffer VCC and GND, close to the buffer.</text>
<text x="45" y="613" class="small" text-anchor="start">Use an accessible VBUS connection; Explorer 3V3 is not a 5 V supply. Unplug USB while wiring.</text>
